<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app">
        <h1>Shopping List</h1>
        <p class="subtitle">Add items, mark them bought, or delete them</p>

        <!-- Input row -->
        <div class="shopping-form">
            <input type="text" id="item-name" placeholder="Item name">
            <input type="number" id="item-quantity" placeholder="Qty" value="1" min="1">
            <button id="add-btn" class="add-btn" type="button">Add Item</button>
        </div>

        <!-- Error message (hidden by default, populated by JS) -->
        <p id="error-message" class="error-message"></p>

        <!-- Remaining counter -->
        <p id="remaining-count" class="remaining-count">0 items remaining</p>

        <!-- The list itself -->
        <ul id="shopping-list" class="shopping-list"></ul>
    </div>

    <script src="shopping-list.js"></script>
</body>
</html>
