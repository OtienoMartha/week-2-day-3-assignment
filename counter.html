<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app">
        <h1>Character Counter</h1>
        <p class="subtitle">280 characters maximum — like a tweet</p>

        <!-- The textarea where the user types -->
        <textarea
            id="tweet-input"
            class="counter-textarea"
            maxlength="350"
            placeholder="What's on your mind?"></textarea>

        <!-- The live count display -->
        <p id="counter-display" class="counter-display">0/280 characters</p>

        <!-- Submit button — disabled when over the limit -->
        <button id="submit-btn" class="submit-btn" type="button">Post</button>
    </div>

    <script src="counter.js"></script>
</body>
</html>
